services:
  postgres:
    image: postgres:16-alpine
    container_name: concert-postgres
    restart: always
    environment:
      POSTGRES_DB: concert_booking
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d concert_booking"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: concert-redis
    restart: always
    ports:
      - "6379:6379"

  backend-1:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: concert-backend-1
    restart: always
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/concert_booking
      GATEWAY_COUNT: 3
      NODE_ID: node_replica_1
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4001:4000"

  backend-2:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: concert-backend-2
    restart: always
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://postgres:password123@postgres:5432/concert_booking
      GATEWAY_COUNT: 3
      NODE_ID: node_replica_2
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4002:4000"

  nginx:
    image: nginx:alpine
    container_name: concert-load-balancer
    restart: always
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend-1
      - backend-2

volumes:
  pgdata:
